<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank Inspection Crawler</title>
<meta name="description" content="Findings from a tank inspection crawler and the welding cell the same loop was first measured on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;450;500;600&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<script>
  /* Applied before the stylesheet paints, so a reader who has chosen a theme
     never sees the other one flash first. No choice stored means no attribute,
     which leaves the page on the reader's system setting. */
  try {
    var t = localStorage.getItem("cell-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* private window, blocked storage: fall through to system */ }
</script>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="page">
    <header class="topbar" id="topbar"></header>
    <main class="body" id="body">
      <div class="card w12"><div class="empty">Loading the run…</div></div>
    </main>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
