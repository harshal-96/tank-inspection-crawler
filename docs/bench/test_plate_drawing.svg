<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" width="900" height="980">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .t    { font-size: 13px; }
    .s    { font-size: 11.5px; }
    .b    { font-size: 15px; font-weight: bold; }
    .h    { font-size: 20px; font-weight: bold; }
    .dim  { stroke: #111; stroke-width: 0.8; fill: none; }
    .out  { stroke: #111; stroke-width: 1.8; fill: #fff; }
    .bead { stroke: #111; stroke-width: 1.2; fill: #d9d9d9; }
    .hid  { stroke: #111; stroke-width: 1.5; fill: none; stroke-dasharray: 7 5; }
    .zone { stroke: #888; stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
    .lead { stroke: #111; stroke-width: 0.7; fill: none; }
    .bal  { stroke: #111; stroke-width: 1.2; fill: #fff; }
    .balt { font-size: 12px; font-weight: bold; text-anchor: middle; }
  </style>
  <rect x="0" y="0" width="900" height="980" fill="#fff"/>

  <text x="40" y="34" class="h">Test plate for ultrasonic inspection trials</text>
  <text x="40" y="54" class="t">Mild steel IS 2062 E250 or equivalent.  600 x 300 x 6.</text>
  <text x="40" y="71" class="t">All dimensions in mm.  Do not paint either face.</text>

  <!-- ============== FRONT VIEW ============== -->
  <text x="140" y="100" class="b">FRONT FACE (welded side)</text>

  <rect x="140" y="112" width="600" height="300" class="out"/>

  <rect x="680" y="112" width="60" height="60" fill="#efe2d6" stroke="#111" stroke-width="1"/>
  <text x="710" y="137" class="s" text-anchor="middle">leave</text>
  <text x="710" y="150" class="s" text-anchor="middle">to rust</text>

  <circle cx="600" cy="307" r="30" class="zone"/>
  <circle cx="280" cy="217" r="30" class="zone"/>

  <!-- bead C, Y=240 -->
  <rect x="190" y="166" width="500" height="12" class="bead"/>
  <text x="178" y="176" class="s" text-anchor="end">C</text>
  <circle cx="420" cy="172" r="3.5" fill="#fff" stroke="#111" stroke-width="1.8"/>

  <!-- bead B, Y=150 -->
  <rect x="190" y="256" width="500" height="12" class="bead"/>
  <text x="178" y="266" class="s" text-anchor="end">B</text>
  <rect x="290" y="268" width="80" height="4" fill="#444"/>
  <circle cx="528" cy="262" r="2" fill="#444"/>
  <circle cx="536" cy="262" r="2" fill="#444"/>
  <circle cx="544" cy="262" r="2" fill="#444"/>
  <circle cx="552" cy="262" r="2" fill="#444"/>
  <circle cx="560" cy="262" r="2" fill="#444"/>

  <!-- bead A, Y=60, 60 long gap at X 320..380 -->
  <rect x="190" y="346" width="270" height="12" class="bead"/>
  <rect x="520" y="346" width="170" height="12" class="bead"/>
  <text x="178" y="356" class="s" text-anchor="end">A</text>

  <!-- hidden pockets -->
  <circle cx="600" cy="307" r="20" class="hid"/>
  <circle cx="280" cy="217" r="20" class="hid"/>
  <text x="600" y="311" class="s" text-anchor="middle" font-weight="bold">P1</text>
  <text x="280" y="221" class="s" text-anchor="middle" font-weight="bold">P2</text>

  <!-- numbered balloons -->
  <line x1="490" y1="352" x2="490" y2="392" class="lead"/>
  <circle cx="490" cy="400" r="11" class="bal"/><text x="490" y="404" class="balt">1</text>

  <line x1="330" y1="272" x2="330" y2="392" class="lead"/>
  <circle cx="330" cy="400" r="11" class="bal"/><text x="330" y="404" class="balt">2</text>

  <line x1="544" y1="260" x2="620" y2="214" class="lead"/>
  <circle cx="630" cy="208" r="11" class="bal"/><text x="630" y="212" class="balt">3</text>

  <line x1="420" y1="172" x2="420" y2="132" class="lead"/>
  <circle cx="420" cy="124" r="11" class="bal"/><text x="420" y="128" class="balt">4</text>

  <line x1="618" y1="328" x2="648" y2="368" class="lead"/>
  <circle cx="656" cy="376" r="11" class="bal"/><text x="656" y="380" class="balt">5</text>

  <!-- X dimensions -->
  <line x1="140" y1="440" x2="740" y2="440" class="dim"/>
  <line x1="140" y1="434" x2="140" y2="446" class="dim"/>
  <line x1="740" y1="434" x2="740" y2="446" class="dim"/>
  <text x="440" y="434" class="t" text-anchor="middle">600</text>

  <line x1="140" y1="466" x2="280" y2="466" class="dim"/>
  <line x1="140" y1="460" x2="140" y2="472" class="dim"/>
  <line x1="280" y1="460" x2="280" y2="472" class="dim"/>
  <text x="210" y="460" class="s" text-anchor="middle">140 to P2 centre</text>

  <line x1="140" y1="492" x2="600" y2="492" class="dim"/>
  <line x1="140" y1="486" x2="140" y2="498" class="dim"/>
  <line x1="600" y1="486" x2="600" y2="498" class="dim"/>
  <text x="370" y="486" class="s" text-anchor="middle">460 to P1 centre</text>

  <!-- Y dimensions -->
  <line x1="116" y1="112" x2="116" y2="412" class="dim"/>
  <line x1="110" y1="112" x2="122" y2="112" class="dim"/>
  <line x1="110" y1="412" x2="122" y2="412" class="dim"/>
  <text x="104" y="262" class="t" text-anchor="middle" transform="rotate(-90 104 262)">300</text>

  <line x1="92" y1="352" x2="92" y2="412" class="dim"/>
  <line x1="86" y1="352" x2="98" y2="352" class="dim"/>
  <text x="80" y="382" class="s" text-anchor="middle" transform="rotate(-90 80 382)">60  bead A</text>

  <line x1="66" y1="262" x2="66" y2="412" class="dim"/>
  <line x1="60" y1="262" x2="72" y2="262" class="dim"/>
  <text x="54" y="337" class="s" text-anchor="middle" transform="rotate(-90 54 337)">150  bead B</text>

  <line x1="40" y1="172" x2="40" y2="412" class="dim"/>
  <line x1="34" y1="172" x2="46" y2="172" class="dim"/>
  <text x="28" y="292" class="s" text-anchor="middle" transform="rotate(-90 28 292)">240  bead C</text>

  <!-- ============== LEGEND ============== -->
  <text x="140" y="528" class="s">All three beads run 500, from X = 50 to X = 550.   P1 centre Y = 105.   P2 centre Y = 195.</text>
  <text x="140" y="544" class="s">Datum is the bottom left corner of the front face. X runs along the 600, Y across the 300.</text>

  <circle cx="152" cy="572" r="11" class="bal"/><text x="152" y="576" class="balt">1</text>
  <text x="172" y="576" class="s">B001  stop the bead for 60 and restart, leaving bare plate showing in the gap</text>

  <circle cx="152" cy="598" r="11" class="bal"/><text x="152" y="602" class="balt">2</text>
  <text x="172" y="602" class="s">B002  grind a groove 80 long and 1.5 deep along the lower toe, into the PLATE, not the bead</text>

  <circle cx="152" cy="624" r="11" class="bal"/><text x="152" y="628" class="balt">3</text>
  <text x="172" y="628" class="s">B003  five pores or dimples, 2 dia, in the face of the bead</text>

  <circle cx="152" cy="650" r="11" class="bal"/><text x="152" y="654" class="balt">4</text>
  <text x="172" y="654" class="s">B004  one hole 6 dia, burned or drilled right through bead and plate</text>

  <circle cx="152" cy="676" r="11" class="bal"/><text x="152" y="680" class="balt">5</text>
  <text x="172" y="680" class="s">dashed circle = pocket machined in the BACK face.  dotted 60 circle = grind the FRONT smooth here</text>

  <!-- ============== SECTION ============== -->
  <text x="140" y="724" class="b">SECTION THROUGH P1</text>
  <text x="330" y="724" class="s">part section. Thickness drawn much enlarged so it can be read.</text>

  <path d="M 150 756 L 650 756 L 650 836 L 480 836 L 480 796 L 400 796 L 400 836 L 150 836 Z"
        fill="#e8e8e8" stroke="#111" stroke-width="2"/>

  <text x="150" y="748" class="s">front face, the probe sits here</text>
  <text x="150" y="852" class="s">back face, the pocket is machined from this side</text>

  <line x1="190" y1="756" x2="190" y2="836" class="dim"/>
  <line x1="184" y1="756" x2="196" y2="756" class="dim"/>
  <line x1="184" y1="836" x2="196" y2="836" class="dim"/>
  <text x="206" y="800" class="t">6 nominal</text>

  <line x1="440" y1="756" x2="440" y2="796" class="dim"/>
  <line x1="434" y1="756" x2="446" y2="756" class="dim"/>
  <line x1="434" y1="796" x2="446" y2="796" class="dim"/>
  <text x="500" y="774" class="b">3.0 LEFT</text>
  <text x="500" y="790" class="s">P2 leaves 4.0</text>

  <line x1="400" y1="862" x2="480" y2="862" class="dim"/>
  <line x1="400" y1="856" x2="400" y2="868" class="dim"/>
  <line x1="480" y1="856" x2="480" y2="868" class="dim"/>
  <text x="440" y="878" class="s" text-anchor="middle">40 dia</text>

  <rect x="140" y="896" width="720" height="66" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="152" y="917" class="b">The figure is the metal REMAINING under the pocket, not the depth of cut.</text>
  <text x="152" y="935" class="s">On a 6 plate, leaving 3.0 means cutting about 3.0 deep. Leaving 4.0 means cutting about 2.0 deep.</text>
  <text x="152" y="951" class="s">Flat bottom, end mill, not a grinder. Measure what you actually achieve and report it to 0.05.</text>
</svg>
